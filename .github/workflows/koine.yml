name: koine

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No dependencies, no network, nothing to install: the suite drives the
      # scripts against files and a git repository it creates in temporary directories.
      - run: python3 tests/test_append_db.py
      - run: python3 tests/test_install_eo_cmd.py
      - run: python3 tests/test_eo_cmd.py
      - run: python3 tests/test_bump.py
