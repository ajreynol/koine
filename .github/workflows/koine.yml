name: koine

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No dependencies, no network, no customer checked out: everything runs
      # against tests/fixtures/customer/.
      - run: python3 tests/run.py
      - run: python3 tests/test_postmortem.py
      - run: python3 tests/test_findings.py
      # Builds its own git repository under a temporary directory.
      - run: python3 tests/test_branch.py
