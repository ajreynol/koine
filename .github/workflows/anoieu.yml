name: anoieu

on: [push, pull_request]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the policy, at the commit this repository pins
        # The pin is `anoieu.lock`, moved by `eo_bump` and never by hand: a
        # commit whose own CI was green there, and no other.
        run: |
          git clone --quiet https://github.com/ajreynol/anoieu /tmp/anoieu
          git -C /tmp/anoieu checkout --quiet "$(grep -v '^#' anoieu.lock | head -1)"
      # The contract is named rather than defaulted. Omitting it selects 1
      # today and would go on selecting 1 after later contracts exist, so the
      # version this tree was actually checked against would stop being
      # readable from the file that decides it.
      - run: python3 /tmp/anoieu/scripts/policy_check.py --policy-version 1 --root .
