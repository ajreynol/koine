name: anoieu

on: [push, pull_request]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the policy, at the commit this repository pins
        # The pin is `anoieu.lock`, moved by `eo_bump` and never by hand. That
        # file also records why the pin and the checker path below move
        # together: the checker moved from tools/ to scripts/ in anoieu after
        # the pinned commit, so bumping one without the other breaks this job.
        run: |
          git clone --quiet https://github.com/ajreynol/anoieu /tmp/anoieu
          git -C /tmp/anoieu checkout --quiet "$(grep -v '^#' anoieu.lock | head -1)"
      - run: python3 /tmp/anoieu/tools/policy_check.py --root .
